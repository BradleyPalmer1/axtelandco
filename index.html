<style>
body {
  font-family: Garamond, serif;
  text-align: center;
  margin: 0;
  padding: 0;
  background: white;
  color: #222;
}

.container {
  max-width: 900px;
  margin: 70px auto 90px auto;
  padding: 0 20px;
}

.logo {
  margin: 0 0 18px 0;
}

.logo img {
  display: block;
  margin: 0 auto;

.line {

.image {

.enquiries {

  margin: 0 0 8px 0;
}

.email {
  font-size: 18px;
  margin: 0 0 28px 0;
}

.email a {
  color: #222;
  text-decoration: none;
}

.email a:hover {
  text-decoration: underline;
}

.footer-line {
  width: 180px;
  height: 1px;
  background: #cfcfcf;
  margin: 0 auto 28px auto;
}

.footer {
  font-size: 13px;
  line-height: 1.7;
  color: #555;
  margin: 0;
}

@media (max-width: 600px) {
  .container {
    margin: 50px auto 70px auto;
    padding: 0 16px;
  }

  .logo img {
    max-width: 260px !important;
  }

  .line,
  .footer-line {
    width: 140px;
  }

  .enquiries,
  .email {
    font-size: 16px;
  }

  .footer {
    font-size: 12px;
  }
}
